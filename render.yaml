# Render Blueprint for the backend (optional: you can also create the service by hand in the dashboard).
# A persistent disk is what keeps SQLite, trained models and uploads across restarts/deploys.
# Persistent disks need a paid instance type; the free tier has a temporary filesystem
# (see "Deployment" in README.md for the free demo option and its limits).
services:
  - type: web
    name: demand-forecasting-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: MODEL_DIR
        value: /var/data/ml_models
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
